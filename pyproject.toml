[project]
name = "videtor"
version = "0.0.1"
description = "Timelines for Premiere Pro and DaVinci Resolve from raw footage, cut in your own style."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "opentimelineio>=0.17",
  "otio-fcp-adapter>=1.0",
  "typer>=0.12",
  "rich>=13",
  "numpy>=1.26",
  "pillow>=10",
  "webrtcvad-wheels>=2.0.14",
  "librosa>=0.10",
  "mediapipe>=0.10",
  "open-clip-torch>=2.24",
  "torch>=2.3",
]

[project.optional-dependencies]
# The desktop window for `videtor ui` (macOS WebKit through pywebview); the page works in the browser without it.
ui = [
  "pywebview>=5",
]
# Phase 1 media analysis. Installed separately so the knowledge-base commands
# stay light: `uv sync --extra analyze`.
analyze = [
  "scenedetect[opencv]>=0.6.4",
  "librosa>=0.10",
  "pyloudnorm>=0.1.1",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.scripts]
videtor = "videtor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videtor"]
